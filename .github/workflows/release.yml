name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build DadSearch App and DMG
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: DadSearch ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            build/DadSearch.dmg
            build/DadSearch.zip
          body: |
            ### 🔍 DadSearch ${{ github.ref_name }}
            
            A native, ultra-lightweight, and elegant macOS universal search app designed for finding downloaded documents, emails, apps, screenshots, and chat attachments with zero cognitive friction.
            
            #### ⬇️ Download & Install
            1. Download `DadSearch.dmg` below.
            2. Double-click the DMG and drag **DadSearch** into your **Applications** folder.
            3. *First time opening:* Right-click `DadSearch` in Applications and choose **Open**, or run `xattr -cr /Applications/DadSearch.app`.
            
            #### ✨ Highlights:
            - **Global Floating Launcher:** Summon instantly with `⌥ + Space` (Option + Space).
            - **Universal Providers:** Apps, Apple Mail, Outlook, Contacts, Calendar, Downloads, Screenshots, and Chat Attachments.
            - **Forgiving & Fast:** Typo-tolerant matching, natural language dates, and relevance ranking.
            - **Senior-Friendly:** Large type, high contrast, live thumbnails, and Quick Look (Spacebar).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

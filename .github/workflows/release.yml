name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2

      - name: Build DadSearch App and DMG
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: DadSearch ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            build/DadSearch.dmg
            build/DadSearch.app
          body: |
            ### 🔍 DadSearch ${{ github.ref_name }}
            
            A native, ultra-lightweight, and elegant macOS universal search app designed for finding downloaded documents, Outlook emails, screenshots, and chat attachments with zero cognitive friction.
            
            #### ⬇️ Download & Install
            1. Download `DadSearch.dmg` below.
            2. Double-click the DMG and drag **DadSearch** into your **Applications** folder.
            3. *First time opening:* Right-click `DadSearch` in Applications and choose **Open**.
            
            #### ✨ Highlights:
            - **3-in-1 Modes:** Floating launcher (`⌥ + Space`), Menu Bar icon, and split-view Window.
            - **Spotlight Fast Engine:** Fast queries without battery or CPU drain.
            - **Outlook Emails & Caches:** Surfaces emails and `.eml` messages.
            - **Screenshots & Recordings:** Easily locates screen captures buried on Desktop.
            - **Chat Attachments:** Finds documents received in WhatsApp, Telegram, and Messages.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
